name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Numbers reconcile
        run: pnpm validate
      - name: Types
        run: pnpm check
      - name: Format
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Render and screenshot every chapter
        run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshots
